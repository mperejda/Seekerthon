services:
  anchor:
    build: .
    image: seekerthon-anchor:0.30.1
    volumes:
      - .:/workspace
      - ~/.config/solana:/root/.config/solana   # keypair passthrough
      - cargo-registry:/root/.cargo/registry     # cache crate downloads
      - cargo-git:/root/.cargo/git
      - build-target:/workspace/target           # cache incremental builds
    working_dir: /workspace
    stdin_open: true
    tty: true

volumes:
  cargo-registry:
  cargo-git:
  build-target:
