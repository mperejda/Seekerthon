[package]
name = "voting"
version = "0.1.0"
description = "Weighted vote for Seekerthon"
edition = "2021"

[lib]
crate-type = ["cdylib", "lib"]
name = "voting"

[features]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
cpi = ["no-entrypoint"]
idl-build = ["anchor-lang/idl-build"]
default = []

[dependencies]
anchor-lang = { version = "0.30.1" }
proc-macro2 = { workspace = true }
