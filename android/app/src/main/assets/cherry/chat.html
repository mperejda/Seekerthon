<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover"
  >
  <title>Seekerthon Chat</title>
  <script src="cherry-embed-0.1.6.js"></script>
  <style>
    html,
    body {
      width: 100%;
      height: 100%;
      margin: 0;
      padding: 0;
      overflow: hidden;
      background: #0a0a12;
    }

    #chat {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      background: #0a0a12;
    }

    #status {
      position: fixed;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      box-sizing: border-box;
      padding: 24px;
      color: #afa9ec;
      font: 14px/1.4 system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      text-align: center;
    }
  </style>
</head>
<body>
  <div id="chat"></div>
  <div id="status">Loading chat...</div>

  <script>
    (function () {
      var chat = null;
      var currentConfig = null;
      var status = document.getElementById("status");

      function toNative(message) {
        if (window.CherryNative && window.CherryNative.postMessage) {
          window.CherryNative.postMessage(JSON.stringify(message));
        }
      }

      function showStatus(message) {
        status.textContent = message;
        status.style.display = "flex";
      }

      function hideStatus() {
        status.style.display = "none";
      }

      function emitError(code, error) {
        var message = error && error.message ? error.message : String(error);
        showStatus("Cherry chat could not load. Please try again.");
        toNative({ type: "event", event: "error", data: { code: code, message: message } });
      }

      function sameEmbed(a, b) {
        return a && b &&
          a.appId === b.appId &&
          a.roomId === b.roomId &&
          a.mode === b.mode &&
          a.embedUrl === b.embedUrl;
      }

      function mount(config) {
        var sdk = window.CherryEmbedSDK;
        if (!sdk || !sdk.CherryEmbed) {
          emitError("SDK_NOT_LOADED", new Error("Cherry SDK 0.1.6 did not load"));
          return;
        }

        if (!config.appId || !config.roomId || !config.token) {
          emitError("BAD_CONFIG", new Error("Missing appId, roomId, or token"));
          return;
        }

        hideStatus();
        document.getElementById("chat").replaceChildren();

        chat = new sdk.CherryEmbed({
          appId: config.appId,
          container: "#chat",
          roomId: config.roomId,
          mode: config.mode || "single",
          position: "inline",
          token: config.token,
          embedUrl: config.embedUrl || "https://embed.cherry.fun",
          theme: config.theme,
          layout: config.layout
        });
        currentConfig = config;

        [
          "ready",
          "authStateChange",
          "unreadCount",
          "message",
          "tokenExpired",
          "preview",
          "roomChanged"
        ].forEach(function (event) {
          chat.on(event, function (data) {
            toNative({ type: "event", event: event, data: data });
          });
        });

        chat.on("error", function (error) {
          toNative({ type: "event", event: "error", data: error });
        });

        chat.mount().then(function () {
          hideStatus();
          toNative({ type: "event", event: "mounted" });
        }).catch(function (error) {
          emitError("MOUNT_FAILED", error);
        });
      }

      window.__cherryReceiveConfig = function (configJson) {
        var config;
        try {
          config = JSON.parse(configJson);
        } catch (error) {
          emitError("BAD_CONFIG", error);
          return;
        }

        if (chat && sameEmbed(currentConfig, config)) {
          if (config.token && config.token !== currentConfig.token) {
            chat.setToken(config.token);
          }
          if (config.theme) chat.setTheme(config.theme);
          if (config.layout) chat.setLayout(config.layout);
          currentConfig = config;
          return;
        }

        if (chat) {
          try { chat.destroy(); } catch (_) {}
          chat = null;
        }
        mount(config);
      };

      window.addEventListener("error", function (event) {
        toNative({
          type: "event",
          event: "error",
          data: { code: "HOST_ERROR", message: event.message || "Host page error" }
        });
      });

      window.addEventListener("unhandledrejection", function (event) {
        var reason = event.reason;
        toNative({
          type: "event",
          event: "error",
          data: {
            code: "HOST_REJECTION",
            message: reason && reason.message ? reason.message : String(reason)
          }
        });
      });

      toNative({ type: "ready" });
    })();
  </script>
</body>
</html>
