<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Seekerthon Chat</title>
  <style>
    html,
    body,
    #chat {
      width: 100%;
      height: 100%;
      min-height: 100vh;
      margin: 0;
      padding: 0;
      background: #0a0a12;
      color: #ffffff;
      overflow: hidden;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    iframe {
      display: block !important;
      width: 100% !important;
      height: 100% !important;
      min-height: 100vh !important;
      background: #14141f;
    }

    .status {
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      box-sizing: border-box;
      padding: 24px;
      text-align: center;
      color: #afa9ec;
      font-size: 14px;
      line-height: 1.4;
    }
  </style>
</head>
<body>
  <div id="chat">
    <div class="status">Loading chat...</div>
  </div>
  <script>
    (function () {
      const sdkUrls = [
        "https://embed.cherry.fun/cherry-embed.js",
        "https://cdn.jsdelivr.net/npm/@cherrydotfun/chat-embed-sdk@0.1.6/dist/index.global.js"
      ];
      const params = new URLSearchParams(window.location.search);
      const appId = params.get("appId");
      const roomId = params.get("roomId");
      const token = params.get("token");
      const embedUrl = params.get("embedUrl") || "https://embed.cherry.fun";
      const viewportHeight = Number(params.get("viewportHeight") || "0");
      const container = document.getElementById("chat");
      let readyTimer = null;

      function viewportPx() {
        const height = Math.max(
          viewportHeight,
          window.innerHeight || 0,
          document.documentElement.clientHeight || 0,
          window.screen && window.screen.height ? window.screen.height : 0,
          600
        );
        return Math.round(height) + "px";
      }

      function forceViewportHeight() {
        const height = viewportPx();
        document.documentElement.style.height = height;
        document.documentElement.style.minHeight = height;
        document.body.style.height = height;
        document.body.style.minHeight = height;
        container.style.height = height;
        container.style.minHeight = height;
        const iframe = container.querySelector("iframe");
        if (iframe) {
          iframe.style.height = height;
          iframe.style.minHeight = height;
        }
      }

      window.__cherryForceHeight = function (heightPx) {
        const height = Math.max(
          window.innerHeight || 0,
          document.documentElement.clientHeight || 0,
          window.screen && window.screen.height ? window.screen.height : 0,
          Number(heightPx) || 0,
          600
        );
        document.documentElement.style.height = Math.round(height) + "px";
        document.documentElement.style.minHeight = Math.round(height) + "px";
        document.body.style.height = Math.round(height) + "px";
        document.body.style.minHeight = Math.round(height) + "px";
        container.style.height = Math.round(height) + "px";
        container.style.minHeight = Math.round(height) + "px";
        const iframe = container.querySelector("iframe");
        if (iframe) {
          iframe.style.height = Math.round(height) + "px";
          iframe.style.minHeight = Math.round(height) + "px";
        }
        reportDom("forced-height");
      };

      function showStatus(message) {
        if (readyTimer) {
          clearTimeout(readyTimer);
          readyTimer = null;
        }
        forceViewportHeight();
        container.innerHTML = "";
        const status = document.createElement("div");
        status.className = "status";
        status.textContent = message;
        container.appendChild(status);
      }

      function loadScript(index, onReady) {
        if (index >= sdkUrls.length) {
          showStatus("Cherry chat failed to load. Check your connection and try again.");
          return;
        }

        const script = document.createElement("script");
        script.src = sdkUrls[index];
        script.async = true;
        script.onload = onReady;
        script.onerror = function () {
          loadScript(index + 1, onReady);
        };
        document.body.appendChild(script);
      }

      window.__cherryUpdateAuth = function (freshToken) {
        if (!window.__cherryChat) return;
        window.__cherryChat.setToken(freshToken);
      };

      function emitNative(event, data) {
        if (!window.CherryNative || !window.CherryNative.onCherryEvent) return;
        window.CherryNative.onCherryEvent(JSON.stringify({ event: event, data: data }));
      }

      function reportDom(label) {
        forceViewportHeight();
        const iframe = container.querySelector("iframe");
        const rect = iframe ? iframe.getBoundingClientRect() : null;
        emitNative("dom", {
          label: label,
          childCount: container.children.length,
          body: { width: document.body.clientWidth, height: document.body.clientHeight },
          chat: { width: container.clientWidth, height: container.clientHeight },
          iframe: rect ? {
            width: Math.round(rect.width),
            height: Math.round(rect.height),
            top: Math.round(rect.top),
            left: Math.round(rect.left),
            src: iframe.src
          } : null
        });
      }

      if (!appId || !roomId || !token) {
        showStatus("Cherry chat is not configured for this build.");
        return;
      }

      function mountCherry() {
        forceViewportHeight();
        emitNative("mounting", { appId: appId, roomId: roomId });
        const sdk = window.CherryEmbedSDK;
        if (!sdk || !sdk.CherryEmbed) {
          loadScript(1, mountCherry);
          return;
        }

        container.innerHTML = "";
        const chat = new sdk.CherryEmbed({
          appId: appId,
          embedUrl: embedUrl,
          roomId: roomId,
          mode: "single",
          token: token,
          container: "#chat",
          theme: { mode: "dark", primaryColor: "#FF5BA8" },
          layout: {
            showHeader: true,
            headerTitle: "Seekerthon Chat",
            showMemberCount: true,
            showInput: true
          }
        });
        window.__cherryChat = chat;
        forceViewportHeight();
        chat.on("ready", function () {
          if (readyTimer) {
            clearTimeout(readyTimer);
            readyTimer = null;
          }
          emitNative("ready", null);
          reportDom("ready");
        });
        chat.on("authStateChange", function (ok) {
          emitNative("authStateChange", ok);
          reportDom("auth");
          setTimeout(function () { reportDom("auth+2s"); }, 2000);
        });
        chat.on("preview", function (state) { emitNative("preview", state); });
        chat.on("walletConnectRequested", function () {
          emitNative("walletConnectRequested", null);
        });
        chat.on("error", function (error) { emitNative("error", error); });
        readyTimer = setTimeout(function () {
          showStatus("Cherry chat did not finish loading. Confirm the embed is enabled and https://appassets.androidplatform.net is in Cherry's allowed origins.");
        }, 15000);
        chat.mount().catch(function (error) {
          showStatus(error && error.message ? error.message : "Cherry chat failed to mount.");
        });
      }

      if (document.readyState === "loading") {
        document.addEventListener("DOMContentLoaded", function () {
          loadScript(0, mountCherry);
        });
      } else {
        loadScript(0, mountCherry);
      }
    })();
  </script>
</body>
</html>
