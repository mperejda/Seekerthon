name: Solana Mobile dApp Store

run-name: Android ${{ inputs.version || github.ref_name }}${{ inputs.publish && ' — publish' || ' — build only' }}

on:
  workflow_dispatch:
    inputs:
      version:
        description: Expected Android versionName (for example, 1.3.2)
        required: true
        type: string
      whats_new:
        description: Release notes shown on the dApp Store
        required: true
        type: string
      publish:
        description: Publish the verified APK to the Solana Mobile dApp Store
        required: true
        default: false
        type: boolean
  push:
    tags:
      - "android-v*"

permissions:
  contents: read

env:
  DAPP_STORE_CLI_VERSION: 1.0.1

concurrency:
  group: solana-dapp-store-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build signed APK
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      ANDROID_API_URL: ${{ secrets.ANDROID_API_URL }}
      ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Java 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android SDK packages
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle cache
        uses: gradle/actions/setup-gradle@v6

      - name: Validate release secrets
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          GOOGLE_SERVICES_JSON_BASE64: ${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}
        run: |
          required=(
            ANDROID_API_URL
            ANDROID_KEYSTORE_BASE64
            ANDROID_KEYSTORE_PASSWORD
            ANDROID_KEY_ALIAS
            ANDROID_KEY_PASSWORD
            GOOGLE_SERVICES_JSON_BASE64
          )
          missing=0
          for name in "${required[@]}"; do
            if [[ -z "${!name:-}" ]]; then
              echo "::error::Missing required GitHub Actions secret: $name"
              missing=1
            fi
          done
          if (( missing )); then
            exit 1
          fi
          if [[ "$ANDROID_API_URL" != */ ]]; then
            echo "::error::ANDROID_API_URL must end with a slash for Retrofit"
            exit 1
          fi

      - name: Restore release-only files
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          GOOGLE_SERVICES_JSON_BASE64: ${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}
        run: |
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/seekerthon-release.keystore"
          printf '%s' "$GOOGLE_SERVICES_JSON_BASE64" | base64 --decode > android/app/google-services.json
          chmod 600 "$RUNNER_TEMP/seekerthon-release.keystore" android/app/google-services.json
          jq --exit-status '.project_info.project_id | strings | length > 0' android/app/google-services.json > /dev/null
          echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/seekerthon-release.keystore" >> "$GITHUB_ENV"

      - name: Build release APK
        working-directory: android
        run: ./gradlew --no-daemon :app:assembleRelease

      - name: Verify APK package and signature
        env:
          EXPECTED_VERSION: ${{ inputs.version }}
        run: |
          APK_PATH="$(find android/app/build/outputs/apk/release -maxdepth 1 -type f -name '*.apk' -print -quit)"
          if [[ -z "$APK_PATH" ]]; then
            echo "::error::Gradle did not produce a release APK"
            exit 1
          fi

          AAPT="$ANDROID_HOME/build-tools/35.0.0/aapt"
          APKSIGNER="$ANDROID_HOME/build-tools/35.0.0/apksigner"
          PACKAGE_LINE="$("$AAPT" dump badging "$APK_PATH" | grep -m1 '^package:')"
          if [[ "$PACKAGE_LINE" != *"name='com.alpinelabs.seekerthon'"* ]]; then
            echo "::error::APK package name is not com.alpinelabs.seekerthon"
            exit 1
          fi
          if [[ "$PACKAGE_LINE" =~ versionName=\'([^\']+)\' ]]; then
            VERSION_NAME="${BASH_REMATCH[1]}"
          else
            echo "::error::Could not read versionName from the APK"
            exit 1
          fi
          if [[ "$GITHUB_EVENT_NAME" == "push" && "$GITHUB_REF_NAME" != "android-v$VERSION_NAME" ]]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match APK version android-v$VERSION_NAME"
            exit 1
          fi
          if [[ "$GITHUB_EVENT_NAME" == "workflow_dispatch" && "$EXPECTED_VERSION" != "$VERSION_NAME" ]]; then
            echo "::error::Requested version $EXPECTED_VERSION does not match APK version $VERSION_NAME"
            exit 1
          fi

          echo "$PACKAGE_LINE"
          "$APKSIGNER" verify --verbose --print-certs "$APK_PATH"

          APK_DIR="$(dirname "$APK_PATH")"
          APK_NAME="$(basename "$APK_PATH")"
          (cd "$APK_DIR" && sha256sum "$APK_NAME" > "$APK_NAME.sha256")

      - name: Upload signed APK
        uses: actions/upload-artifact@v7
        with:
          name: seekerthon-signed-apk-${{ github.run_number }}
          path: |
            android/app/build/outputs/apk/release/*.apk
            android/app/build/outputs/apk/release/*.apk.sha256
          if-no-files-found: error
          retention-days: 30

  publish:
    name: Publish to dApp Store
    if: github.event_name == 'workflow_dispatch' && inputs.publish
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    environment: solana-dapp-store

    steps:
      - name: Download signed APK
        uses: actions/download-artifact@v7
        with:
          name: seekerthon-signed-apk-${{ github.run_number }}
          path: release

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          registry-url: https://registry.npmjs.org

      - name: Install Solana Mobile publisher CLI
        run: |
          npm install --global "@solana-mobile/dapp-store-cli@$DAPP_STORE_CLI_VERSION"
          dapp-store --version

      - name: Validate publisher secrets
        env:
          DAPP_STORE_API_KEY: ${{ secrets.DAPP_STORE_API_KEY }}
          SOLANA_PUBLISHER_KEYPAIR_BASE64: ${{ secrets.SOLANA_PUBLISHER_KEYPAIR_BASE64 }}
        run: |
          if [[ -z "$DAPP_STORE_API_KEY" ]]; then
            echo "::error::Missing required GitHub Actions secret: DAPP_STORE_API_KEY"
            exit 1
          fi
          if [[ -z "$SOLANA_PUBLISHER_KEYPAIR_BASE64" ]]; then
            echo "::error::Missing required GitHub Actions secret: SOLANA_PUBLISHER_KEYPAIR_BASE64"
            exit 1
          fi

      - name: Publish verified APK
        env:
          DAPP_STORE_API_KEY: ${{ secrets.DAPP_STORE_API_KEY }}
          SOLANA_PUBLISHER_KEYPAIR_BASE64: ${{ secrets.SOLANA_PUBLISHER_KEYPAIR_BASE64 }}
          WHATS_NEW: ${{ inputs.whats_new }}
        run: |
          APK_PATH="$(find release -type f -name '*.apk' -print -quit)"
          if [[ -z "$APK_PATH" ]]; then
            echo "::error::Signed APK artifact is missing"
            exit 1
          fi
          APK_DIR="$(dirname "$APK_PATH")"
          APK_NAME="$(basename "$APK_PATH")"
          (cd "$APK_DIR" && sha256sum --check "$APK_NAME.sha256")

          KEYPAIR_PATH="$RUNNER_TEMP/solana-publisher-keypair.json"
          printf '%s' "$SOLANA_PUBLISHER_KEYPAIR_BASE64" | base64 --decode > "$KEYPAIR_PATH"
          chmod 600 "$KEYPAIR_PATH"
          jq --exit-status 'type == "array" and length == 64 and all(.[]; type == "number")' "$KEYPAIR_PATH" > /dev/null

          printf '%s' "$DAPP_STORE_API_KEY" | dapp-store \
            --apk-file "$APK_PATH" \
            --keypair "$KEYPAIR_PATH" \
            --whats-new "$WHATS_NEW" \
            --api-key-stdin \
            --idempotency-key "github-${{ github.run_id }}"
